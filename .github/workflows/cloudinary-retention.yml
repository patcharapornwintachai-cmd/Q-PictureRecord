name: Cloudinary 3-Month Retention

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

jobs:
  retention:
    runs-on: ubuntu-latest

    steps:
      - name: Check retention
        env:
          CLOUDINARY_CLOUD_NAME: ozv3rnvu
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import requests
          import hashlib
          import time
          from datetime import datetime, timezone, timedelta

          cloud = os.environ["CLOUDINARY_CLOUD_NAME"]
          api_key = os.environ["CLOUDINARY_API_KEY"]
          api_secret = os.environ["CLOUDINARY_API_SECRET"]

          now = datetime.now(timezone.utc) + timedelta(hours=7)

          print("Bangkok time:", now)

          # Run deletion only on the last day of each month
          tomorrow = now + timedelta(days=1)

          if tomorrow.month == now.month:
              print("Today is not the last day of the month.")
              print("No deletion required.")
              raise SystemExit(0)

          # Keep the latest 3 calendar months.
          # Example: Aug 31 -> delete May.
          year = now.year
          month = now.month - 3

          while month <= 0:
              month += 12
              year -= 1

          target_month = f"{year:04d}-{month:02d}"

          print("Target month:", target_month)

          timestamp = int(time.time())

          expression = f"tags=QPictureRecord"

          search_url = (
              f"https://api.cloudinary.com/v1_1/{cloud}/resources/search"
          )

          payload = {
              "expression": expression,
              "max_results": 500
          }

          auth = (api_key, api_secret)

          response = requests.post(
              search_url,
              json=payload,
              auth=auth
          )

          response.raise_for_status()

          data = response.json()

          resources = data.get("resources", [])

          print("Found tagged resources:", len(resources))

          for item in resources:
              created_at = item.get("created_at", "")
              public_id = item.get("public_id")

              if not created_at or not public_id:
                  continue

              created_month = created_at[:7]

              if created_month == target_month:
                  print("Deleting:", public_id)

                  signature = hashlib.sha1(
                      (
                          f"public_id={public_id}"
                          f"&timestamp={timestamp}"
                          f"{api_secret}"
                      ).encode()
                  ).hexdigest()

                  delete_url = (
                      f"https://api.cloudinary.com/v1_1/"
                      f"{cloud}/resources/image/upload"
                  )

                  delete_data = {
                      "public_ids[]": public_id,
                      "timestamp": timestamp,
                      "api_key": api_key,
                      "signature": signature
                  }

                  delete_response = requests.delete(
                      delete_url,
                      data=delete_data
                  )

                  print(
                      delete_response.status_code,
                      delete_response.text
                  )

          print("Retention check completed.")
          PY
