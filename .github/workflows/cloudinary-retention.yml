name: Cloudinary 3-Month Month-End Retention

on:
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  retention:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check and delete month-end retention cohort
        env:
          CLOUDINARY_CLOUD_NAME: ozv3rnvu
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const https=require('https');
          const crypto=require('crypto');
          const TZ='Asia/Bangkok';
          const cloud=process.env.CLOUDINARY_CLOUD_NAME;
          const key=process.env.CLOUDINARY_API_KEY;
          const secret=process.env.CLOUDINARY_API_SECRET;
          const ghToken=process.env.GH_TOKEN;
          const repo=process.env.GH_REPO;

          function parts(d=new Date()){
            const a=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(d);
            const o={}; for(const x of a) if(x.type!=='literal') o[x.type]=x.value;
            return {y:+o.year,m:+o.month,d:+o.day};
          }
          function pad(n){return String(n).padStart(2,'0')}
          function iso(y,m,d){return `${y}-${pad(m)}-${pad(d)}`}
          function monthStart(y,m){return iso(y,m,1)}
          function addMonths(y,m,n){let z=new Date(Date.UTC(y,m-1+n,1));return {y:z.getUTCFullYear(),m:z.getUTCMonth()+1}}
          function lastDay(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate()}
          function request(url,opts={}){return new Promise((resolve,reject)=>{const r=https.request(url,opts,res=>{let b='';res.on('data',c=>b+=c);res.on('end',()=>resolve({status:res.statusCode,headers:res.headers,body:b}));});r.on('error',reject);if(opts.body)r.write(opts.body);r.end()})}
          function auth(){return Buffer.from(`${key}:${secret}`).toString('base64')}
          async function cloudSearch(expression){let out=[],cursor=null;do{let u=new URL(`https://api.cloudinary.com/v1_1/${cloud}/resources/search`);u.searchParams.set('expression',expression);u.searchParams.set('max_results','500');if(cursor)u.searchParams.set('next_cursor',cursor);let r=await request(u,{headers:{Authorization:`Basic ${auth()}`}});if(r.status!==200)throw new Error(`Cloudinary search ${r.status}: ${r.body.slice(0,300)}`);let j=JSON.parse(r.body);out.push(...(j.resources||[]));cursor=j.next_cursor||null;}while(cursor);return out}
          async function cloudDelete(publicIds){if(!publicIds.length)return 0;let deleted=0;for(let i=0;i<publicIds.length;i+=100){let ids=publicIds.slice(i,i+100);let body=JSON.stringify({public_ids:ids,invalidate:true});let r=await request(`https://api.cloudinary.com/v1_1/${cloud}/resources/image/upload`,{method:'DELETE',headers:{Authorization:`Basic ${auth()}`,'Content-Type':'application/json','Content-Length':Buffer.byteLength(body)},body});if(r.status!==200)throw new Error(`Cloudinary delete ${r.status}: ${r.body.slice(0,300)}`);deleted+=ids.length;}return deleted}
          async function githubPut(path,obj){const api=`https://api.github.com/repos/${repo}/contents/${path}`;let get=await request(api,{headers:{Authorization:`Bearer ${ghToken}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'}});let sha=get.status===200?JSON.parse(get.body).sha:undefined;let content=Buffer.from(JSON.stringify(obj,null,2)+'\n').toString('base64');let payload={message:'Update Cloudinary retention status',content,branch:'main'};if(sha)payload.sha=sha;let r=await request(api,{method:'PUT',headers:{Authorization:`Bearer ${ghToken}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.status<200||r.status>=300)throw new Error(`GitHub status update ${r.status}: ${r.body.slice(0,300)}`)}

          (async()=>{
            const now=parts();
            const isLast=now.d===lastDay(now.y,now.m);
            const target=addMonths(now.y,now.m,-3);
            const targetNext=addMonths(now.y,now.m,-2);
            const targetMonth=iso(target.y,target.m,1).slice(0,7);
            const expression=`folder:QPictureRecord AND uploaded_at>=${monthStart(target.y,target.m)} AND uploaded_at<${monthStart(targetNext.y,targetNext.m)}`;
            const resources=await cloudSearch(expression);
            let deleted=0;
            if(isLast){deleted=await cloudDelete(resources.map(x=>x.public_id).filter(Boolean));}
            let nextY, nextM, nextTarget, nextTargetNext, nextCount=0;
            if(isLast){
              const nm=addMonths(now.y,now.m,1);
              nextY=nm.y; nextM=nm.m;
              nextTarget=addMonths(nextY,nextM,-3);
              nextTargetNext=addMonths(nextY,nextM,-2);
              const nextExpr=`folder:QPictureRecord AND uploaded_at>=${monthStart(nextTarget.y,nextTarget.m)} AND uploaded_at<${monthStart(nextTargetNext.y,nextTargetNext.m)}`;
              nextCount=(await cloudSearch(nextExpr)).length;
            }else{
              nextY=now.y; nextM=now.m; nextTarget=target; nextTargetNext=targetNext; nextCount=resources.length;
            }
            const nextDate=iso(nextY,nextM,lastDay(nextY,nextM));
            const status={status:isLast?'completed':'scheduled',updatedAt:new Date().toISOString(),nextDeletionDate:nextDate,nextDeletionMonth:iso(nextTarget.y,nextTarget.m,1).slice(0,7),nextDeleteCount:nextCount,lastDeletedMonth:isLast?targetMonth:null,lastDeletedCount:isLast?deleted:0,note:'3 calendar months retained; deletion runs automatically on the last day of each month using Thailand time.'};
            await githubPut('data/retention-status.json',status);
            console.log(JSON.stringify(status,null,2));
          })().catch(e=>{console.error(e);process.exit(1)})
          NODE
