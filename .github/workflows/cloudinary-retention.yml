name: Q-Snap Cloudinary Delete

on:
  push:
    branches: [main]
    paths:
      - 'data/cloudinary-delete-queue.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qsnap-cloudinary-delete
  cancel-in-progress: false

jobs:
  delete-cloudinary-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets and queue
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          test -n "$CLOUDINARY_CLOUD_NAME" || (echo 'Missing secret: CLOUDINARY_CLOUD_NAME' && exit 1)
          test -n "$CLOUDINARY_API_KEY" || (echo 'Missing secret: CLOUDINARY_API_KEY' && exit 1)
          test -n "$CLOUDINARY_API_SECRET" || (echo 'Missing secret: CLOUDINARY_API_SECRET' && exit 1)
          test -f data/cloudinary-delete-queue.json || (echo 'Queue file is missing; create data/cloudinary-delete-queue.json containing []' && exit 1)

      - name: Delete queued Cloudinary images
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: |
          python3 - <<'PY'
          import json, os, time, hashlib, urllib.parse, urllib.request, urllib.error
          from pathlib import Path

          q = Path('data/cloudinary-delete-queue.json')
          ids = json.loads(q.read_text(encoding='utf-8'))
          if not isinstance(ids, list):
              raise SystemExit('Queue JSON must be a list of Cloudinary public_id strings.')
          ids = list(dict.fromkeys(str(x).strip() for x in ids if str(x).strip()))
          if not ids:
              print('Delete queue is empty; no Cloudinary assets were deleted.')
              raise SystemExit(0)

          cloud = os.environ['CLOUDINARY_CLOUD_NAME']
          key = os.environ['CLOUDINARY_API_KEY']
          secret = os.environ['CLOUDINARY_API_SECRET']
          failed = []
          succeeded = 0

          for public_id in ids:
              ts = int(time.time())
              params = {'invalidate': 'true', 'public_id': public_id, 'timestamp': str(ts)}
              to_sign = '&'.join(f'{k}={params[k]}' for k in sorted(params)) + secret
              signature = hashlib.sha1(to_sign.encode('utf-8')).hexdigest()
              form = {
                  'public_id': public_id,
                  'timestamp': str(ts),
                  'api_key': key,
                  'signature': signature,
                  'invalidate': 'true',
              }
              url = f'https://api.cloudinary.com/v1_1/{cloud}/image/destroy'
              req = urllib.request.Request(url, data=urllib.parse.urlencode(form).encode(), method='POST')
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode('utf-8'))
                  result = payload.get('result', '')
                  print(f'{public_id}: {result}')
                  if result in ('ok', 'not found'):
                      succeeded += 1
                  else:
                      failed.append(public_id)
              except Exception as exc:
                  detail = ''
                  if isinstance(exc, urllib.error.HTTPError):
                      try: detail = exc.read().decode('utf-8')[:500]
                      except Exception: pass
                  print(f'FAILED {public_id}: {exc} {detail}')
                  failed.append(public_id)

          q.write_text(json.dumps(failed, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(f'Processed {len(ids)} queued item(s); accepted/deleted/not-found: {succeeded}; failed: {len(failed)}')
          if failed:
              raise SystemExit(f'{len(failed)} asset(s) failed; failed public_id values remain in queue for retry.')
          PY

      - name: Commit queue result
        if: always()
        run: |
          git config user.name 'Q-Snap Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/cloudinary-delete-queue.json
          git diff --cached --quiet && exit 0
          git commit -m 'Q-Snap: update Cloudinary delete queue'
          git push
