name: Cloudinary 3-Month Month-End Retention

on:
  schedule:
    # Runs every day at 10:15 AM Bangkok time.
    # The script itself only deletes on the last day of the month.
    - cron: '15 3 * * *'

  workflow_dispatch:
    inputs:
      force_delete:
        description: 'Delete the target 3-month-old month now (use only for testing)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  retention:
    runs-on: ubuntu-latest

    steps:
      - name: Check Cloudinary retention
        env:
          CLOUDINARY_CLOUD_NAME: ozv3rnvu
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          FORCE_DELETE: ${{ inputs.force_delete }}
        run: |
          node <<'NODE'
          const https = require('https');

          const cloud = process.env.CLOUDINARY_CLOUD_NAME;
          const key = process.env.CLOUDINARY_API_KEY;
          const secret = process.env.CLOUDINARY_API_SECRET;
          const forceDelete = String(process.env.FORCE_DELETE).toLowerCase() === 'true';

          if (!cloud) {
            throw new Error('Missing CLOUDINARY_CLOUD_NAME');
          }

          if (!key) {
            throw new Error('Missing CLOUDINARY_API_KEY');
          }

          if (!secret) {
            throw new Error('Missing CLOUDINARY_API_SECRET');
          }

          function request(url, opts = {}) {
            return new Promise((resolve, reject) => {
              const req = https.request(url, opts, res => {
                let body = '';

                res.on('data', chunk => {
                  body += chunk;
                });

                res.on('end', () => {
                  resolve({
                    status: res.statusCode,
                    headers: res.headers,
                    body
                  });
                });
              });

              req.on('error', reject);

              if (opts.body) {
                req.write(opts.body);
              }

              req.end();
            });
          }

          function auth() {
            return Buffer
              .from(`${key}:${secret}`)
              .toString('base64');
          }

          function getBangkokDateParts() {
            const parts = new Intl.DateTimeFormat('en-CA', {
              timeZone: 'Asia/Bangkok',
              year: 'numeric',
              month: '2-digit',
              day: '2-digit'
            }).formatToParts(new Date());

            const result = {};

            for (const part of parts) {
              if (part.type !== 'literal') {
                result[part.type] = Number(part.value);
              }
            }

            return result;
          }

          function daysInMonth(year, month) {
            return new Date(Date.UTC(year, month, 0)).getUTCDate();
          }

          function shiftMonth(year, month, amount) {
            const date = new Date(Date.UTC(year, month - 1 + amount, 1));

            return {
              year: date.getUTCFullYear(),
              month: date.getUTCMonth() + 1
            };
          }

          function monthStart(year, month) {
            return `${year}-${String(month).padStart(2, '0')}-01`;
          }

          async function cloudSearch(expression) {
            let results = [];
            let cursor = null;

            do {
              const url = new URL(
                `https://api.cloudinary.com/v1_1/${cloud}/resources/search`
              );

              url.searchParams.set('expression', expression);
              url.searchParams.set('max_results', '500');

              if (cursor) {
                url.searchParams.set('next_cursor', cursor);
              }

              const response = await request(url, {
                method: 'GET',
                headers: {
                  'Authorization': `Basic ${auth()}`,
                  'User-Agent': 'QPictureRecord-Retention'
                }
              });

              if (response.status !== 200) {
                throw new Error(
                  `Cloudinary search ${response.status}: ${response.body.slice(0, 500)}`
                );
              }

              const json = JSON.parse(response.body);

              results.push(...(json.resources || []));

              cursor = json.next_cursor || null;

            } while (cursor);

            return results;
          }

          async function cloudDelete(publicIds) {
            if (!publicIds.length) {
              return 0;
            }

            let deleted = 0;

            for (let i = 0; i < publicIds.length; i += 100) {
              const ids = publicIds.slice(i, i + 100);

              const body = JSON.stringify({
                public_ids: ids,
                invalidate: true
              });

              const response = await request(
                `https://api.cloudinary.com/v1_1/${cloud}/resources/image/upload`,
                {
                  method: 'DELETE',
                  headers: {
                    'Authorization': `Basic ${auth()}`,
                    'User-Agent': 'QPictureRecord-Retention',
                    'Content-Type': 'application/json',
                    'Content-Length': Buffer.byteLength(body)
                  },
                  body
                }
              );

              if (response.status !== 200) {
                throw new Error(
                  `Cloudinary delete ${response.status}: ${response.body.slice(0, 500)}`
                );
              }

              deleted += ids.length;
            }

            return deleted;
          }

          async function main() {
            const today = getBangkokDateParts();

            const lastDay = daysInMonth(today.year, today.month);

            const isLastDay =
              today.day === lastDay;

            console.log(
              `Bangkok date: ${today.year}-${String(today.month).padStart(2, '0')}-${String(today.day).padStart(2, '0')}`
            );

            console.log(`Last day of month: ${lastDay}`);
            console.log(`Is month-end: ${isLastDay}`);
            console.log(`Force delete: ${forceDelete}`);

            if (!isLastDay && !forceDelete) {
              console.log(
                'Today is not the last day of the month. No deletion will be performed.'
              );

              return;
            }

            /*
             * Example:
             *
             * August 31
             *       ↓
             * Delete images uploaded during May
             *
             * This keeps June + July + August = 3 calendar months.
             */

            const target = shiftMonth(
              today.year,
              today.month,
              -3
            );

            const nextMonth = shiftMonth(
              target.year,
              target.month,
              1
            );

            const start = monthStart(
              target.year,
              target.month
            );

            const end = monthStart(
              nextMonth.year,
              nextMonth.month
            );

            console.log(
              `Target month for deletion: ${target.year}-${String(target.month).padStart(2, '0')}`
            );

            console.log(`Search range: ${start} to ${end}`);

            /*
             * IMPORTANT:
             * This searches images inside the Cloudinary folder
             * QPictureRecord.
             */

            const expression =
              `folder:QPictureRecord ` +
              `AND uploaded_at>=${start} ` +
              `AND uploaded_at<${end}`;

            console.log(`Cloudinary expression: ${expression}`);

            const resources =
              await cloudSearch(expression);

            console.log(
              `Found ${resources.length} image(s) in the target month.`
            );

            if (!resources.length) {
              console.log(
                'No images found. Nothing to delete.'
              );

              return;
            }

            const publicIds =
              resources
                .map(resource => resource.public_id)
                .filter(Boolean);

            console.log(
              `Images ready for deletion: ${publicIds.length}`
            );

            const deleted =
              await cloudDelete(publicIds);

            console.log(
              `Successfully deleted ${deleted} image(s) from Cloudinary.`
            );
          }

          main().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE
