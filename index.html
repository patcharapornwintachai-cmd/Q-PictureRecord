<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QC Photo Record V6</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:#f4f7fb;color:#172033}header{background:#2563eb;color:#fff;padding:16px;position:sticky;top:0;z-index:5}header h1{margin:0;font-size:22px}header p{margin:4px 0 0;font-size:12px}nav{display:flex;background:#fff;position:sticky;top:67px;z-index:4;border-bottom:1px solid #ddd}nav button{flex:1;padding:13px;border:0;background:#fff;font-weight:bold;color:#667085}nav button.active{color:#2563eb;border-bottom:3px solid #2563eb}main{max-width:1100px;margin:auto;padding:14px}.page{display:none}.page.active{display:block}.card{background:#fff;border-radius:15px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0001}.grid,.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.full{grid-column:1/-1}label{font-weight:bold;font-size:13px;display:block;margin-bottom:6px}input,select{width:100%;padding:11px;border:1px solid #ccd5e1;border-radius:9px;font:inherit}select[multiple]{min-height:110px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:#2563eb;color:#fff}.gray{background:#e9eef5}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.blue{background:#eef2ff;color:#1e40af}.photoBtns{display:flex;gap:8px;flex-wrap:wrap}.photoBtn{background:#eef2ff;color:#1e40af;padding:11px;border-radius:9px;font-weight:bold;cursor:pointer}.photoBtn input{display:none}.preview{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.photo{position:relative;aspect-ratio:1;border:1px solid #ddd;border-radius:9px;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.photo button{position:absolute;right:4px;top:4px;border:0;border-radius:50%;background:#000b;color:#fff;width:28px;height:28px}.muted{font-size:12px;color:#667085;margin-top:5px}.datepick{display:flex;gap:6px}.datepick input{flex:1}.calbtn{border:1px solid #ccd5e1;background:#eef2ff;border-radius:9px;padding:0 12px;font-size:18px;cursor:pointer}.calendarBox{background:#fff;border-radius:14px;padding:14px;width:min(360px,100%)}.calHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.calHead button{border:0;background:#eef2ff;border-radius:8px;padding:8px 12px;cursor:pointer}.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calGrid button{border:0;background:#f8fafc;border-radius:7px;padding:9px 2px;cursor:pointer}.calGrid button:hover{background:#dbeafe}.calGrid .today{font-weight:bold;border:2px solid #2563eb}.calGrid .empty{background:transparent;cursor:default}.historyPics{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.historyPic{width:62px;height:62px;object-fit:cover;border-radius:7px;border:1px solid #dbe2ea;background:#f8fafc;cursor:pointer}.noPic{color:#98a2b3;font-size:11px}.table{overflow:auto;max-height:600px;border:1px solid #ddd;border-radius:9px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid #ddd;white-space:nowrap;text-align:left}th{background:#f8fafc}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:center;justify-content:center;padding:15px}.modal.show{display:flex}.box{background:#fff;padding:20px;border-radius:14px;width:min(400px,100%)}.notice{padding:10px;background:#eff6ff;border-radius:9px;color:#1e40af;font-size:13px}@media(max-width:700px){.grid,.filters{grid-template-columns:1fr}.full{grid-column:auto}.preview{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header><h1>📋 QC Photo Record V6</h1><p>Record • History • Setting</p></header><nav><button id="tRecord" class="active" onclick="page('record')">📝 Record</button><button id="tHistory" onclick="page('history')">🗂️ History</button><button id="tSetting" onclick="auth('setting')">⚙️ Setting 🔐</button></nav><main>
<section id="record" class="page active"><div class="card"><h2>📝 Record</h2><div class="grid">
<div><label>Code</label><input id="code" list="codeList" autocomplete="off" placeholder="กรอก Code"><datalist id="codeList"></datalist><div class="muted"></div></div>
<div><label>Batch No.</label><input id="batch" inputmode="numeric" placeholder="กรอก Batch"></div>
<div><label>Inspector</label><select id="inspector"></select></div><div><label>Inspection date/time</label><input id="dt" readonly></div></div>
<div style="margin-top:14px"><label>Inspection pic. <span class="muted">(สูงสุด 6 รูป)</span></label><div class="photoBtns"><label class="photoBtn">📱 ถ่ายรูป<input id="camera" type="file" accept="image/*" capture="environment"></label><label class="photoBtn">🖼️ เลือกรูป<input id="gallery" type="file" accept="image/*" multiple></label></div><div id="pc" class="muted">0 / 6 รูป</div><div id="preview" class="preview"></div></div>
<div class="actions"><button class="btn primary" onclick="save()">💾 บันทึกข้อมูล</button><button class="btn gray" onclick="clearForm()">↩️ ล้างข้อมูล</button></div></div></section>
<section id="history" class="page"><div class="card"><h2>🗂️ History</h2><div class="filters"><div><label>🔎 ค้นหา</label><input id="search" placeholder="Code / Batch / Inspector"></div><div><label>Inspector</label><select id="fins"></select></div><div><label>วันที่เริ่ม</label><div class="datepick"><input id="start" type="text" readonly placeholder="dd/mm/yyyy"><button type="button" class="calbtn" onclick="openDatePicker('start')">📅</button></div></div><div><label>วันที่สิ้นสุด</label><div class="datepick"><input id="end" type="text" readonly placeholder="dd/mm/yyyy"><button type="button" class="calbtn" onclick="openDatePicker('end')">📅</button></div></div></div><div class="actions"><button class="btn gray" onclick="resetF()">Reset</button><button class="btn green" onclick="exportExcel()">📥 Export All / Filter</button></div><div class="muted">ข้อมูลทั้งหมด: <b id="total">0</b> | แสดง: <b id="shown">0</b></div></div><div class="card"><div class="table"><table><thead><tr><th>#</th><th>Code</th><th>Batch</th><th>Inspector</th><th>Date/Time</th><th>Inspection pic.</th><th>ลบ</th></tr></thead><tbody id="tbody"></tbody></table></div></div></section>
<section id="setting" class="page"><div class="card"><h2>⚙️ Setting</h2><div class="notice">เฉพาะเจ้าหน้าที่</div><label style="margin-top:12px">ตั้งรหัสใหม่</label><input id="newpw" type="password" inputmode="numeric"><div class="actions"><button class="btn primary" onclick="setPw()">💾 บันทึกรหัส</button></div></div><div class="card"><h2>👤 Inspector</h2><div id="ilist"></div><div class="actions"><button class="btn green" onclick="addI()">➕ เพิ่ม Inspector</button></div><div class="muted">แก้ไข/ลบเฉพาะรายการสำหรับข้อมูลใหม่ ไม่กระทบข้อมูลที่เคยบันทึก</div></div></section>
</main><div id="imageModal" class="modal" onclick="closeImage(event)"><div class="box" style="max-width:900px;text-align:center"><img id="bigImage" style="max-width:100%;max-height:75vh;object-fit:contain;border-radius:10px"></div></div><div id="dateModal" class="modal"><div class="calendarBox"><div class="calHead"><button onclick="changeMonth(-1)">‹</button><b id="calTitle"></b><button onclick="changeMonth(1)">›</button></div><div class="calGrid" id="calGrid"></div><div class="actions"><button class="btn gray" onclick="closeDatePicker()">ปิด</button></div></div></div><div id="modal" class="modal"><div class="box"><h3>🔐 ใส่รหัส</h3><input id="pw" type="password" inputmode="numeric"><div class="actions"><button class="btn primary" onclick="verify()">ยืนยัน</button><button class="btn gray" onclick="closeM()">ยกเลิก</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script>
const DB='QCPhotoV6Final',R='records',S='settings';let db,recs=[],imgs=[],ins=[],pending=null,action='';
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function dbOpen(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=e=>{let d=e.target.result;if(!d.objectStoreNames.contains(R))d.createObjectStore(R,{keyPath:'id',autoIncrement:true});if(!d.objectStoreNames.contains(S))d.createObjectStore(S,{keyPath:'key'})};r.onsuccess=e=>{db=e.target.result;ok()};r.onerror=()=>no(r.error)})}
function all(s){return new Promise((ok,no)=>{let r=db.transaction(s).objectStore(s).getAll();r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function put(s,o){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).put(o);r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}function remove(s,id){return new Promise((ok,no)=>{let r=db.transaction(s,'readwrite').objectStore(s).delete(id);r.onsuccess=()=>ok();r.onerror=()=>no(r.error)})}
async function setting(k,d){let a=await all(S),x=a.find(v=>v.key===k);return x?x.value:d}
async function init(){await dbOpen();recs=await all(R);ins=await setting('inspectors',['Inspector 1']);if(await setting('password',null)===null)await put(S,{key:'password',value:'1166A'});$('dt').value=new Date().toLocaleString('th-TH');setInterval(()=>{$('dt').value=new Date().toLocaleString('th-TH')},1000);renderIns();renderHistory();renderTable();renderSetting()}
function page(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(p).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));$('t'+p[0].toUpperCase()+p.slice(1)).classList.add('active');if(p==='history')renderTable()}
function auth(a,id=null){action=a;pending=id;$('pw').value='';$('modal').classList.add('show');$('pw').focus()}function closeM(){$('modal').classList.remove('show');action='';pending=null}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();verify()}});
async function verify(){let p=$('pw').value,real=await setting('password','1166');if(p!==real)return alert('รหัสไม่ถูกต้อง');if(action==='setting'){closeM();page('setting')}else{await remove(R,pending);recs=await all(R);closeM();renderHistory();renderTable();alert('ลบข้อมูลเรียบร้อย')}}
$('code').oninput=e=>{let n=e.target.selectionStart;e.target.value=e.target.value.toUpperCase();e.target.setSelectionRange(n,n)};$('batch').oninput=e=>e.target.value=e.target.value.replace(/[^0-9]/g,'');
function read(f){return new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}
async function files(fs){let left=6-imgs.length;if(fs.length>left)alert('เพิ่มได้อีก '+left+' รูป');for(let f of [...fs].slice(0,left))if(f.type.startsWith('image/'))imgs.push({type:f.type,data:await read(f)});renderPhotos()}
camera.onchange=e=>{files(e.target.files);e.target.value=''};gallery.onchange=e=>{files(e.target.files);e.target.value=''};function renderPhotos(){$('pc').textContent=imgs.length+' / 6 รูป';$('preview').innerHTML=imgs.map((p,i)=>`<div class="photo"><img src="${p.data}"><button onclick="imgs.splice(${i},1);renderPhotos()">×</button></div>`).join('')}
async function save(){let c=$('code').value.trim().toUpperCase(),b=$('batch').value.trim(),i=$('inspector').value;if(!c||!b||!i)return alert('⚠️ กรุณากรอกข้อมูลให้ครบก่อนบันทึก');let r={code:c,batch:b,inspector:i,inspectionDateTime:new Date().toISOString(),photos:[...imgs]};await put(R,r);recs=await all(R);alert('✅ บันทึกข้อมูลเรียบร้อย');clearForm();renderHistory();renderTable()}
function clearForm(){$('code').value='';$('batch').value='';imgs=[];renderPhotos()}
function renderIns(){let cur=$('inspector').value;$('inspector').innerHTML='<option value="">-- เลือก Inspector --</option>'+ins.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('inspector').value=ins.includes(cur)?cur:'';$('fins').innerHTML='<option value="">ทั้งหมด</option>'+ins.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}
function renderSetting(){$('ilist').innerHTML=ins.map((x,i)=>`<div class="actions" style="margin-bottom:7px"><input id="ii${i}" value="${esc(x)}" style="flex:1"><button class="btn blue" onclick="renameI(${i})">✏️</button><button class="btn red" onclick="delI(${i})">🗑️</button></div>`).join('')}
async function persistIns(){await put(S,{key:'inspectors',value:ins});renderIns();renderSetting()}async function addI(){let n=prompt('ชื่อ Inspector')?.trim();if(!n)return;if(ins.includes(n))return alert('มีชื่อนี้แล้ว');ins.push(n);await persistIns()}async function renameI(i){let n=$('ii'+i).value.trim();if(!n)return;if(ins.some((x,j)=>j!==i&&x===n))return alert('มีชื่อนี้แล้ว');ins[i]=n;await persistIns();alert('แก้ไขสำหรับข้อมูลใหม่แล้ว')}async function delI(i){if(ins.length<=1)return alert('ต้องมีอย่างน้อย 1 Inspector');if(!confirm('ลบ Inspector นี้? ข้อมูลเก่าไม่เปลี่ยน'))return;ins.splice(i,1);await persistIns()}
async function setPw(){let p=$('newpw').value.trim();if(!p)return alert('กรุณาใส่รหัสใหม่');await put(S,{key:'password',value:p});$('newpw').value='';alert('บันทึกรหัสแล้ว')}
function filtered(){let q=$('search').value.trim().toLowerCase(),i=$('fins').value,s=filterDate($('start').value),e=filterDate($('end').value);return recs.filter(r=>{let d=r.inspectionDateTime.slice(0,10);return(!q||`${r.code} ${r.batch} ${r.inspector}`.toLowerCase().includes(q))&&(!i||r.inspector===i)&&(!s||d>=s)&&(!e||d<=e)})}
function renderHistory(){let c=[...new Set(recs.map(r=>r.code))].filter(Boolean).sort();$('codeList').innerHTML=c.map(x=>`<option value="${esc(x)}">`).join('')}
function renderTable(){let a=filtered();$('total').textContent=recs.length;$('shown').textContent=a.length;$('tbody').innerHTML=a.length?a.map((r,n)=>{let pics=(r.photos||[]).map((p,j)=>`<img class="historyPic" src="${p.data}" alt="Inspection ${j+1}" title="รูปที่ ${j+1}" onclick="openImage(this.src)">`).join('');return `<tr><td>${n+1}</td><td>${esc(r.code)}</td><td>${esc(r.batch)}</td><td>${esc(r.inspector)}</td><td>${new Date(r.inspectionDateTime).toLocaleString('th-TH')}</td><td><div class="historyPics">${pics||'<span class="noPic">ไม่มีรูป</span>'}</div></td><td><button class="btn red" onclick="auth('delete',${r.id})">🗑️</button></td></tr>`}).join(''):'<tr><td colspan="7">ไม่พบข้อมูล</td></tr>'}
['search','fins','start','end'].forEach(id=>$(id).addEventListener('input',renderTable));function resetF(){$('search').value='';$('fins').value='';$('start').value='';$('end').value='';renderTable()}
function openImage(src){$('bigImage').src=src;$('imageModal').classList.add('show')}function closeImage(e){if(e.target.id==='imageModal')$('imageModal').classList.remove('show')}
let dateTarget='',calDate=new Date();
function openDatePicker(target){dateTarget=target;let v=$(target).value;let m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);calDate=m?new Date(+m[3],+m[2]-1,+m[1]):new Date();renderCalendar();$('dateModal').classList.add('show')}
function closeDatePicker(){$('dateModal').classList.remove('show')}
function changeMonth(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}
function renderCalendar(){let y=calDate.getFullYear(),m=calDate.getMonth();$('calTitle').textContent=`${String(m+1).padStart(2,'0')}/${y}`;let first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),today=new Date();let h=['อา','จ','อ','พ','พฤ','ศ','ส'].map(x=>`<b style="text-align:center;padding:6px;font-size:11px">${x}</b>`).join('');let cells='';for(let i=0;i<first;i++)cells+='<span></span>';for(let d=1;d<=days;d++){let is=today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d;cells+=`<button class="${is?'today':''}" onclick="pickDate(${d})">${d}</button>`}$('calGrid').innerHTML=h+cells}
function pickDate(d){let dd=String(d).padStart(2,'0'),mm=String(calDate.getMonth()+1).padStart(2,'0'),yyyy=calDate.getFullYear();$(dateTarget).value=`${dd}/${mm}/${yyyy}`;closeDatePicker();renderTable()}
function filterDate(v){let m=v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);return m?`${m[3]}-${m[2]}-${m[1]}`:''}
function b64(d){let x=atob(d.split(',')[1]),a=new Uint8Array(x.length);for(let i=0;i<x.length;i++)a[i]=x.charCodeAt(i);return a}
async function exportExcel(){let a=filtered();if(!a.length)return alert('ไม่มีข้อมูลสำหรับ Export');if(!window.ExcelJS)return alert('กรุณาเชื่อมต่ออินเทอร์เน็ตเพื่อโหลด ExcelJS');let w=new ExcelJS.Workbook(),s=w.addWorksheet('QC Records');s.columns=[{header:'No.',key:'n',width:7},{header:'Code',key:'c',width:20},{header:'Batch',key:'b',width:18},{header:'Inspector',key:'i',width:20},{header:'Inspection Date/Time',key:'d',width:24},{header:'Photo 1',width:18},{header:'Photo 2',width:18},{header:'Photo 3',width:18},{header:'Photo 4',width:18},{header:'Photo 5',width:18},{header:'Photo 6',width:18}];s.getRow(1).font={bold:true};s.views=[{state:'frozen',ySplit:1}];for(let k=0;k<a.length;k++){let r=a[k],row=s.addRow({n:k+1,c:r.code,b:r.batch,i:r.inspector,d:new Date(r.inspectionDateTime).toLocaleString('th-TH')});row.height=125;(r.photos||[]).slice(0,6).forEach((p,j)=>{let ext=(p.type||'').includes('png')?'png':'jpeg',id=w.addImage({buffer:b64(p.data),extension:ext});s.addImage(id,{tl:{col:5+j,row:row.number-1},ext:{width:115,height:115}})})}let out=await w.xlsx.writeBuffer(),a1=document.createElement('a');a1.href=URL.createObjectURL(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));a1.download=`QC_Photo_Record_V6_${a.length===recs.length?'ALL':'FILTERED'}.xlsx`;a1.click()}
init();
</script></body></html>
